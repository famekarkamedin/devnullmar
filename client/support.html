<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Поддержка — NULLMARKET</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: #f3f5fc;
            color: #121826;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .blur-object {
            position: fixed;
            z-index: 0;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            pointer-events: none;
        }

        .blur-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #a78bfa, #3b82f6);
            top: -150px;
            left: -150px;
        }

        .blur-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #f97316, #facc15);
            bottom: -250px;
            right: -200px;
            opacity: 0.4;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 28px;
            position: relative;
            z-index: 2;
        }

        .header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.6);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(125deg, #0F2027, #203A43, #2C5364);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-link {
            color: #475569;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #4f46e5;
        }

        .nav-link.active {
            color: #4f46e5;
            font-weight: 600;
        }

        .user-menu-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            position: relative;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e2e8f0;
        }
        
        .user-name {
            font-weight: 600;
            color: #1e293b;
        }
        
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            min-width: 200px;
            display: none;
            overflow: hidden;
            z-index: 50;
        }
        
        .dropdown-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        
        .dropdown-name {
            font-weight: 700;
            font-size: 14px;
        }
        
        .dropdown-email {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }
        
        .dropdown-balance {
            font-size: 13px;
            margin-top: 6px;
            color: #f59e0b;
            font-weight: 600;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
        }
        
        .dropdown-item:hover {
            background: #f1f5f9;
        }
        
        .dropdown-item.logout {
            border-top: 1px solid #e2e8f0;
            color: #ef4444;
        }

        .support-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 28px;
            margin: 40px 0;
        }

        .support-sidebar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 32px;
        }

        .category-item {
            padding: 12px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
        }

        .category-item:hover {
            background: rgba(79, 70, 229, 0.08);
            color: #4f46e5;
        }

        .category-item.active {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
        }

        .category-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .category-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
        }

        .category-item.active .category-icon svg {
            stroke: white;
        }

        .faq-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .faq-item {
            margin-bottom: 16px;
        }

        .faq-question {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .faq-answer {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
            display: none;
        }

        .faq-answer.show {
            display: block;
        }

        .support-main {
            min-width: 0;
        }

        .tickets-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .tickets-title {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
        }

        .btn-create-ticket {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-create-ticket:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79,70,229,0.3);
        }

        .btn-create-ticket.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: linear-gradient(135deg, #94a3b8, #64748b);
        }

        .btn-create-ticket.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .tickets-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 12px;
        }

        .tabs-btn {
            padding: 10px 24px;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.2s;
        }

        .tabs-btn:hover {
            background: rgba(79, 70, 229, 0.08);
            color: #4f46e5;
        }

        .tabs-btn.active {
            background: #4f46e5;
            color: white;
        }

        .tickets-list {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.4);
            overflow: hidden;
        }

        .tickets-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            font-weight: 700;
            font-size: 18px;
            background: rgba(255,255,255,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-item {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .ticket-item:hover {
            background: rgba(79, 70, 229, 0.05);
        }

        .ticket-info {
            flex: 1;
        }

        .ticket-number {
            font-weight: 700;
            color: #4f46e5;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .ticket-subject {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .ticket-meta {
            font-size: 12px;
            color: #64748b;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ticket-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-open { background: #dbeafe; color: #1e40af; }
        .status-in_progress { background: #fef3c7; color: #92400e; }
        .status-closed { background: #fee2e2; color: #b91c1c; }
        .status-waiting_user { background: #fef3c7; color: #b45309; }
        .status-waiting_support { background: #dbeafe; color: #1e40af; }
        .status-waiting_admin { background: #f3e8ff; color: #6b21a5; }

        .ticket-date {
            font-size: 12px;
            color: #94a3b8;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }

        .priority-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .priority-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .priority-dot.urgent { background: #dc2626; box-shadow: 0 0 0 2px rgba(220,38,38,0.2); }
        .priority-dot.high { background: #f97316; box-shadow: 0 0 0 2px rgba(249,115,22,0.2); }
        .priority-dot.medium { background: #eab308; box-shadow: 0 0 0 2px rgba(234,179,8,0.2); }
        .priority-dot.low { background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }

        .create-ticket-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .form-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .form-label span {
            color: #ef4444;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            transition: all 0.2s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .ticket-detail-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 28px;
            background: transparent;
        }

        .ticket-info-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .info-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .ticket-detail-number {
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .ticket-detail-subject {
            font-size: 18px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .info-label {
            color: #64748b;
            font-weight: 500;
        }

        .info-value {
            color: #1e293b;
            font-weight: 500;
            text-align: right;
        }

        .ticket-message-preview {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 20px;
        }

        .ticket-message-preview-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .ticket-message-preview-text {
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .action-buttons {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        .btn-delete-card {
            flex: 1;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #ef4444;
            padding: 10px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-back-card {
            flex: 1;
            background: #eef2ff;
            border: none;
            color: #4f46e5;
            padding: 10px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
            min-height: 500px;
        }

        .chat-header-simple {
            padding: 20px 24px;
            border-bottom: 1px solid #eef2ff;
            background: rgba(255,255,255,0.6);
            border-radius: 28px 28px 0 0;
        }

        .chat-header-simple h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .chat-header-simple p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .message {
            display: flex;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.support {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            word-break: break-word;
        }

        .message.user .message-bubble {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.support .message-bubble {
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .author-name {
            font-weight: 700;
            font-size: 14px;
        }

        .message.user .author-name {
            color: rgba(255,255,255,0.95);
        }

        .message.support .author-name {
            color: #1e293b;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-time {
            font-size: 10px;
            margin-top: 6px;
            opacity: 0.7;
        }

        .message.user .message-time {
            color: rgba(255,255,255,0.7);
            text-align: right;
        }

        .message.support .message-time {
            color: #94a3b8;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .role-owner { background: #fef3c7; color: #b45309; border-left: 2px solid #f59e0b; }
        .role-co_owner { background: #f3f4f6; color: #4b5563; border-left: 2px solid #9ca3af; }
        .role-project_leadership { background: #fee2e2; color: #b91c1c; border-left: 2px solid #ef4444; }
        .role-developer { background: #dbeafe; color: #1e40af; border-left: 2px solid #3b82f6; }
        .role-tech_admin { background: #d1fae5; color: #065f46; border-left: 2px solid #10b981; }
        .role-admin { background: #fecaca; color: #991b1b; border-left: 2px solid #dc2626; }
        .role-junior_admin { background: #fed7aa; color: #9a3412; border-left: 2px solid #f97316; }
        .role-community_manager { background: #dcfce7; color: #166534; border-left: 2px solid #22c55e; }
        .role-curator { background: #f3e8ff; color: #6b21a5; border-left: 2px solid #a855f7; }
        .role-recruiter { background: #ccfbf1; color: #115e59; border-left: 2px solid #14b8a6; }
        .role-pro_support { background: #e0e7ff; color: #3730a3; border-left: 2px solid #6366f1; }
        .role-tech_support { background: #e2e8f0; color: #334155; border-left: 2px solid #64748b; }
        .role-beta_tester { background: #ede9fe; color: #5b21b6; border-left: 2px solid #8b5cf6; }
        .role-support_trainee { background: #f1f5f9; color: #475569; border-left: 2px solid #94a3b8; }
        .role-old { background: #fef3c7; color: #b45309; border-left: 2px solid #d97706; }
        .role-fame { background: #fce7f3; color: #be185d; border-left: 2px solid #ec4899; }
        .role-philanthropist { background: #d1fae5; color: #065f46; border-left: 2px solid #059669; }
        .role-purchased_admin { background: #f3e8ff; color: #6b21a5; border-left: 2px solid #c026d3; }
        .role-user { background: #f1f5f9; color: #475569; border-left: 2px solid #94a3b8; }

        .reply-form {
            padding: 20px 24px;
            border-top: 1px solid #eef2ff;
            background: white;
            border-radius: 0 0 28px 28px;
        }

        .reply-form textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            background: #ffffff;
        }

        .reply-form textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
        }

        .reply-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .btn-send {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #4f46e5;
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .closed-badge {
            text-align: center;
            padding: 16px;
            background: #f1f5f9;
            border-radius: 24px;
            color: #64748b;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
 backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 32px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: modalFadeIn 0.2s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .modal-icon.warning {
            background: #fef3c7;
            color: #d97706;
        }

        .modal-icon.danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .modal-icon.success {
            background: #dcfce7;
            color: #16a34a;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .modal-message {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .modal-btn.cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .modal-btn.cancel:hover {
            background: #e2e8f0;
        }

        .modal-btn.confirm {
            background: #ef4444;
            color: white;
        }

        .modal-btn.confirm:hover {
            background: #dc2626;
        }

        .modal-btn.ok {
            background: #4f46e5;
            color: white;
        }

        .modal-btn.ok:hover {
            background: #4338ca;
        }

        /* Custom Toast Notification */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: white;
            padding: 14px 28px;
            border-radius: 56px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
            background: rgba(30,41,59,0.95);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: rgba(220,38,38,0.95);
        }

        .toast.success {
            background: rgba(22,163,74,0.95);
        }

        @media (max-width: 900px) {
            .support-layout { grid-template-columns: 1fr; }
            .support-sidebar { position: static; }
            .ticket-detail-layout { grid-template-columns: 1fr; }
            .ticket-info-card { position: static; }
            .chat-container { height: 550px; }
            .form-row { grid-template-columns: 1fr; }
            .user-name { display: none; }
            .message-bubble { max-width: 90%; }
        }
    </style>
</head>
<body>
<div class="blur-object blur-1"></div>
<div class="blur-object blur-2"></div>

<header class="header">
    <div class="header-inner">
        <div style="display: flex; align-items: center; gap: 32px;">
            <span class="logo" onclick="window.location.href='/'">NULLMARKET</span>
            <div class="nav-links">
                <a href="/" class="nav-link">Главная</a>
                <a href="/marketplace" class="nav-link">Маркетплейс</a>
                <a href="/my/tickets" class="nav-link active">Поддержка</a>
            </div>
        </div>
        <div id="authButtonContainer"><div class="loading-spinner" style="padding:0;">Загрузка...</div></div>
    </div>
</header>

<main class="container">
    <div id="appRoot"></div>
</main>

<script>
    let currentUser = null;
    let allTickets = [];

    // Toast notification
    function showToast(message, type = 'info') {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = `toast ${type === 'error' ? 'error' : (type === 'success' ? 'success' : '')}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // Custom confirm modal
    function showConfirm(title, message, onConfirm) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal">
                <div class="modal-icon warning">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/></svg>
                </div>
                <div class="modal-title">${title}</div>
                <div class="modal-message">${message}</div>
                <div class="modal-buttons">
                    <button class="modal-btn cancel" id="modalCancel">Отмена</button>
                    <button class="modal-btn confirm" id="modalConfirm">Подтвердить</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        
        const cancelBtn = overlay.querySelector('#modalCancel');
        const confirmBtn = overlay.querySelector('#modalConfirm');
        
        const closeModal = () => overlay.remove();
        
        cancelBtn.addEventListener('click', closeModal);
        confirmBtn.addEventListener('click', () => {
            closeModal();
            onConfirm();
        });
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
    }

    // Custom alert modal
    function showAlert(title, message, type = 'success') {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        const iconClass = type === 'error' ? 'danger' : (type === 'warning' ? 'warning' : 'success');
        const iconSvg = type === 'error' 
            ? '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
            : '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        
        overlay.innerHTML = `
            <div class="modal">
                <div class="modal-icon ${iconClass}">${iconSvg}</div>
                <div class="modal-title">${title}</div>
                <div class="modal-message">${message}</div>
                <div class="modal-buttons">
                    <button class="modal-btn ok" id="modalOk">Хорошо</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        
        const okBtn = overlay.querySelector('#modalOk');
        const closeModal = () => overlay.remove();
        okBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
    }

    const statusDisplayMap = {
        'open': 'Ожидает ответа поддержки',
        'in_progress': 'В обработке',
        'waiting_user': 'Ожидает ответа пользователя',
        'waiting_support': 'Ожидает ответа поддержки',
        'waiting_admin': 'Ожидает ответа администрации',
        'closed': 'Закрыто'
    };

    function getStatusDisplay(status) {
        return statusDisplayMap[status] || 'Ожидает ответа поддержки';
    }

    function getStatusClass(status) {
        const classMap = {
            'open': 'status-waiting_support',
            'in_progress': 'status-in_progress',
            'waiting_user': 'status-waiting_user',
            'waiting_support': 'status-waiting_support',
            'waiting_admin': 'status-waiting_admin',
            'closed': 'status-closed'
        };
        return classMap[status] || 'status-waiting_support';
    }

    const roleDisplayNames = {
        'owner': 'Владелец',
        'co_owner': 'Со-Владелец',
        'project_leadership': 'Руководство Проекта',
        'developer': 'Разработчик',
        'tech_admin': 'Тех. Администратор',
        'admin': 'Администратор',
        'junior_admin': 'Мл. Администратор',
        'community_manager': 'Community Manager',
        'curator': 'Куратор Администрации',
        'recruiter': 'Рекрутер',
        'pro_support': 'Проф. Поддержка',
        'tech_support': 'Тех. Поддержка',
        'beta_tester': 'Бета-Тестер',
        'support_trainee': 'Стажер Поддержки',
        'old': 'Олд',
        'fame': 'Фейм',
        'philanthropist': 'Филантроп',
        'purchased_admin': 'Покупной Администратор',
        'user': 'Пользователь'
    };

    const roleClasses = {
        'owner': 'role-owner',
        'co_owner': 'role-co_owner',
        'project_leadership': 'role-project_leadership',
        'developer': 'role-developer',
        'tech_admin': 'role-tech_admin',
        'admin': 'role-admin',
        'junior_admin': 'role-junior_admin',
        'community_manager': 'role-community_manager',
        'curator': 'role-curator',
        'recruiter': 'role-recruiter',
        'pro_support': 'role-pro_support',
        'tech_support': 'role-tech_support',
        'beta_tester': 'role-beta_tester',
        'support_trainee': 'role-support_trainee',
        'old': 'role-old',
        'fame': 'role-fame',
        'philanthropist': 'role-philanthropist',
        'purchased_admin': 'role-purchased_admin',
        'user': 'role-user'
    };

    function getRoleDisplayName(role) {
        return roleDisplayNames[role] || (role === 'support' ? 'Сотрудник поддержки' : (role === 'admin' ? 'Администратор' : 'Пользователь'));
    }

    function getRoleClass(role) {
        return roleClasses[role] || (role === 'support' ? 'role-tech_support' : 'role-user');
    }

    const categoryIcons = {
        'Техническая поддержка': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
        'Финансовые вопросы': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20"/></svg>',
        'Покупки и заказы': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
        'Аккаунт и безопасность': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
        'Жалоба': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
        'Общий вопрос': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    };

    const ticketCategories = {
        'Техническая поддержка': { subcategories: ['Проблемы с сайтом', 'Ошибки при оплате', 'Проблемы с авторизацией', 'Другое'] },
        'Финансовые вопросы': { subcategories: ['Пополнение баланса', 'Вывод средств', 'Возврат средств', 'Бонусы'] },
        'Покупки и заказы': { subcategories: ['Статус заказа', 'Проблемы с товаром', 'Отмена заказа', 'Гарантия'] },
        'Аккаунт и безопасность': { subcategories: ['Восстановление пароля', 'Двухфакторная аутентификация', 'Подозрительная активность'] },
        'Жалоба': { subcategories: ['На продавца', 'На сотрудника', 'Нарушение правил'] },
        'Общий вопрос': { subcategories: ['Консультация', 'Предложение', 'Другое'] }
    };

    async function apiCall(endpoint, options = {}) {
        const response = await fetch(endpoint, {
            headers: { 'Content-Type': 'application/json' },
            ...options
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Ошибка запроса');
        return data;
    }

    async function checkAuth() {
        try {
            const response = await fetch('/api/me');
            if (response.ok) {
                currentUser = await response.json();
                showUserMenu(currentUser);
                initRouter();
            } else {
                window.location.href = '/auth';
            }
        } catch(e) {
            window.location.href = '/auth';
        }
    }

    function showUserMenu(user) {
        const container = document.getElementById('authButtonContainer');
        container.innerHTML = `
            <div class="user-menu-container">
                <img src="${user.avatar}" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?background=4f46e5&color=fff&name=${encodeURIComponent(user.name)}&size=40'">
                <span class="user-name">${user.name}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                <div class="user-dropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-name">${user.name}</div>
                        <div class="dropdown-email">${user.email}</div>
                        <div class="dropdown-balance">Баланс: ${user.balance || 0} руб.</div>
                    </div>
                    <div class="dropdown-item" data-action="profile" data-user-id="${user.user_id}">Мой профиль</div>
                    <div class="dropdown-item logout" data-action="logout">Выйти</div>
                </div>
            </div>
        `;
        
        const menuContainer = document.querySelector('.user-menu-container');
        const dropdown = document.querySelector('.user-dropdown');
        menuContainer?.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', () => { if (dropdown) dropdown.style.display = 'none'; });
        
        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', async (e) => {
                e.stopPropagation();
                dropdown.style.display = 'none';
                const action = item.dataset.action;
                const userId = item.dataset.userId;
                if (action === 'logout') {
                    await fetch('/api/logout', { method: 'POST' });
                    window.location.href = '/';
                } else if (action === 'profile' && userId) {
                    window.location.href = `/user/${userId}`;
                }
            });
        });
    }

    function hasActiveTicket() {
        return allTickets.some(t => t.status !== 'closed');
    }

    function initRouter() {
        const path = window.location.pathname;
        if (path === '/my/tickets/create') {
            renderCreateTicketPage();
        } else if (path.startsWith('/my/tickets/') && path !== '/my/tickets/create') {
            const ticketId = path.split('/').pop();
            renderTicketDetailPage(parseInt(ticketId));
        } else {
            renderTicketsListPage();
        }
    }

    function navigateTo(path) {
        window.history.pushState({}, '', path);
        initRouter();
    }

    window.addEventListener('popstate', () => initRouter());

    async function renderTicketsListPage() {
        await loadTickets();
        const stats = getStats(allTickets);
        const hasActive = hasActiveTicket();
        
        document.getElementById('appRoot').innerHTML = `
            <div class="support-layout">
                <div class="support-sidebar">
                    <div class="sidebar-title">Категории обращений</div>
                    <div class="category-list" id="categoryList"></div>
                    <div class="faq-section">
                        <div class="sidebar-title">Частые вопросы</div>
                        <div class="faq-item"><div class="faq-question" onclick="window.toggleFaq(this)">Как долго обрабатывается заявка?<span>▼</span></div><div class="faq-answer">Обычно ответ приходит в течение 24 часов.</div></div>
                        <div class="faq-item"><div class="faq-question" onclick="window.toggleFaq(this)">Могу ли я закрыть обращение?<span>▼</span></div><div class="faq-answer">Да, вы можете удалить обращение в любой момент.</div></div>
                        <div class="faq-item"><div class="faq-question" onclick="window.toggleFaq(this)">Сколько тикетов можно создать?<span>▼</span></div><div class="faq-answer">Только один активный тикет одновременно.</div></div>
                    </div>
                </div>
                <div class="support-main">
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number">${stats.total}</div><div class="stat-label">Всего</div></div>
                        <div class="stat-card"><div class="stat-number">${stats.active}</div><div class="stat-label">Активных</div></div>
                        <div class="stat-card"><div class="stat-number">${stats.closed}</div><div class="stat-label">Закрытых</div></div>
                    </div>
                    <div class="tickets-header-bar">
                        <div class="tickets-title">Мои обращения</div>
                        <button class="btn-create-ticket ${hasActive ? 'disabled' : ''}" id="createTicketBtn" ${hasActive ? 'disabled' : ''}>+ Создать обращение</button>
                    </div>
                    <div class="tickets-tabs">
                        <button class="tabs-btn active" data-filter="all">Все</button>
                        <button class="tabs-btn" data-filter="open">Открытые</button>
                        <button class="tabs-btn" data-filter="closed">Закрытые</button>
                    </div>
                    <div class="tickets-list">
                        <div class="tickets-header"><span>Список обращений</span><span id="ticketsCount">${allTickets.length}</span></div>
                        <div id="ticketsList"></div>
                    </div>
                </div>
            </div>
        `;
        
        const createBtn = document.getElementById('createTicketBtn');
        if (createBtn) {
            createBtn.onclick = () => {
                if (hasActive) {
                    showAlert('Невозможно создать обращение', 'У вас уже есть активное обращение. Закройте (удалите) его, прежде чем создать новое.', 'warning');
                } else {
                    navigateTo('/my/tickets/create');
                }
            };
        }
        
        renderCategoriesList();
        renderTicketsList(allTickets);
        
        document.querySelectorAll('.tabs-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tabs-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                let filtered = allTickets;
                if (filter === 'open') filtered = allTickets.filter(t => t.status !== 'closed');
                else if (filter === 'closed') filtered = allTickets.filter(t => t.status === 'closed');
                renderTicketsList(filtered);
            };
        });
    }

    function getStats(tickets) {
        return {
            total: tickets.length,
            active: tickets.filter(t => t.status !== 'closed').length,
            closed: tickets.filter(t => t.status === 'closed').length
        };
    }

    function renderCategoriesList() {
        const container = document.getElementById('categoryList');
        if (!container) return;
        container.innerHTML = Object.keys(ticketCategories).map(cat => `
            <div class="category-item" onclick="document.getElementById('ticketCategory') && (document.getElementById('ticketCategory').value = '${cat.replace(/'/g, "\\'")}')">
                <span class="category-icon">${categoryIcons[cat] || categoryIcons['Общий вопрос']}</span>
                <span>${cat}</span>
            </div>
        `).join('');
    }

    function renderTicketsList(tickets) {
        const container = document.getElementById('ticketsList');
        const countSpan = document.getElementById('ticketsCount');
        if (countSpan) countSpan.innerText = tickets.length;
        if (!container) return;
        
        if (!tickets.length) {
            container.innerHTML = '<div class="empty-state">У вас пока нет обращений в поддержку</div>';
            return;
        }
        
        container.innerHTML = tickets.map(ticket => {
            const priorityClass = getPriorityDotClass(ticket.priority);
            const statusClass = getStatusClass(ticket.status);
            const statusText = getStatusDisplay(ticket.status);
            return `
                <div class="ticket-item" onclick="navigateTo('/my/tickets/${ticket.id}')">
                    <div class="ticket-info">
                        <div class="ticket-number">#${ticket.ticket_number}</div>
                        <div class="ticket-subject">${escapeHtml(ticket.subject)}</div>
                        <div class="ticket-meta">
                            <span>${escapeHtml(ticket.department)}</span>
                            <span class="priority-indicator">
                                <span class="priority-dot ${priorityClass}"></span>
                                <span>${getPriorityText(ticket.priority)}</span>
                            </span>
                            <span class="ticket-status ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                    <div class="ticket-date">${formatDate(ticket.created_at)}</div>
                </div>
            `;
        }).join('');
    }

    async function renderCreateTicketPage() {
        const hasActive = hasActiveTicket();
        if (hasActive) {
            showAlert('Невозможно создать обращение', 'У вас уже есть активное обращение. Удалите его, прежде чем создать новое.', 'warning');
            navigateTo('/my/tickets');
            return;
        }
        
        document.getElementById('appRoot').innerHTML = `
            <div class="support-layout">
                <div class="support-sidebar">
                    <div class="sidebar-title">Категории обращений</div>
                    <div class="category-list" id="categoryListSidebar"></div>
                    <div class="faq-section">
                        <div class="sidebar-title">Частые вопросы</div>
                        <div class="faq-item"><div class="faq-question" onclick="window.toggleFaq(this)">Как долго обрабатывается заявка?<span>▼</span></div><div class="faq-answer">Обычно ответ приходит в течение 24 часов.</div></div>
                        <div class="faq-item"><div class="faq-question" onclick="window.toggleFaq(this)">Могу ли я закрыть обращение?<span>▼</span></div><div class="faq-answer">Да, вы можете удалить обращение в любой момент.</div></div>
                    </div>
                </div>
                <div class="support-main">
                    <div class="create-ticket-card">
                        <div class="form-title">Создать обращение</div>
                        <div class="form-subtitle">Опишите вашу проблему, и мы свяжемся с вами</div>
                        <form id="ticketForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Тема <span>*</span></label>
                                    <input type="text" class="form-input" id="ticketSubject" required placeholder="Коротко опишите суть">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Категория <span>*</span></label>
                                    <select class="form-select" id="ticketCategory" required>
                                        <option value="">Выберите категорию</option>
                                        ${Object.keys(ticketCategories).map(cat => `<option value="${cat}">${cat}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Подкатегория</label>
                                    <select class="form-select" id="ticketSubcategory" disabled>
                                        <option value="">Выберите подкатегорию</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Приоритет <span>*</span></label>
                                    <select class="form-select" id="ticketPriority" required>
                                        <option value="low">Низкий</option>
                                        <option value="medium" selected>Средний</option>
                                        <option value="high">Высокий</option>
                                        <option value="urgent">Критический</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Сообщение <span>*</span></label>
                                <textarea class="form-textarea" id="ticketMessage" required placeholder="Подробно опишите вашу проблему..."></textarea>
                            </div>
                            <div style="display: flex; gap: 16px; justify-content: space-between;">
                                <button type="button" class="btn-back-card" onclick="navigateTo('/my/tickets')" style="padding: 12px 24px;">← Назад к списку</button>
                                <button type="submit" class="btn-submit">Отправить обращение</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        `;
        
        const sidebarContainer = document.getElementById('categoryListSidebar');
        if (sidebarContainer) {
            sidebarContainer.innerHTML = Object.keys(ticketCategories).map(cat => `
                <div class="category-item" onclick="document.getElementById('ticketCategory').value = '${cat.replace(/'/g, "\\'")}'; updateSubcategories('${cat.replace(/'/g, "\\'")}')">
                    <span class="category-icon">${categoryIcons[cat] || categoryIcons['Общий вопрос']}</span>
                    <span>${cat}</span>
                </div>
            `).join('');
        }
        
        document.getElementById('ticketCategory')?.addEventListener('change', (e) => updateSubcategories(e.target.value));
        
        document.getElementById('ticketForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const subject = document.getElementById('ticketSubject').value.trim();
            const message = document.getElementById('ticketMessage').value.trim();
            const department = document.getElementById('ticketCategory').value;
            const subcategory = document.getElementById('ticketSubcategory').value;
            const priority = document.getElementById('ticketPriority').value;
            
            if (!subject || !message || !department) {
                showAlert('Ошибка', 'Заполните все обязательные поля', 'error');
                return;
            }
            
            try {
                await apiCall('/api/tickets', {
                    method: 'POST',
                    body: JSON.stringify({ subject, message, department, subcategory, priority })
                });
                showToast('Обращение успешно создано!', 'success');
                navigateTo('/my/tickets');
            } catch(e) { 
                showAlert('Ошибка', e.message, 'error');
            }
        });
    }

    async function renderTicketDetailPage(ticketId) {
        try {
            const data = await apiCall(`/api/tickets/${ticketId}`);
            const ticket = data.ticket;
            const replies = data.replies || [];
            const priorityClass = getPriorityDotClass(ticket.priority);
            const isOpen = ticket.status !== 'closed';
            const statusClass = getStatusClass(ticket.status);
            const statusText = getStatusDisplay(ticket.status);
            
            let messagesHtml = '';
            
            const userRole = currentUser?.role || 'user';
            const userRoleDisplay = getRoleDisplayName(userRole);
            const userRoleClass = getRoleClass(userRole);
            
            const formattedMessage = escapeHtml(ticket.message).replace(/\n/g, '<br>');
            
            messagesHtml += `
                <div class="message user">
                    <div class="message-bubble">
                        <div class="message-header">
                            <span class="author-name">${escapeHtml(currentUser?.name || 'Вы')}</span>
                            <span class="role-badge ${userRoleClass}">${userRoleDisplay}</span>
                        </div>
                        <div class="message-text">${formattedMessage}</div>
                        <div class="message-time">${formatDate(ticket.created_at)}</div>
                    </div>
                </div>
            `;
            
            replies.forEach(reply => {
                const replyRole = reply.role || (reply.is_staff ? 'tech_support' : 'user');
                const replyRoleDisplay = getRoleDisplayName(replyRole);
                const replyRoleClass = getRoleClass(replyRole);
                const isStaff = reply.is_staff || ['admin', 'support', 'tech_support', 'pro_support', 'owner', 'co_owner', 'project_leadership', 'developer', 'tech_admin', 'junior_admin', 'community_manager', 'curator', 'recruiter', 'support_trainee'].includes(replyRole);
                
                const formattedReplyMessage = escapeHtml(reply.message).replace(/\n/g, '<br>');
                
                if (isStaff) {
                    messagesHtml += `
                        <div class="message support">
                            <div class="message-bubble">
                                <div class="message-header">
                                    <span class="author-name">${escapeHtml(reply.user_name)}</span>
                                    <span class="role-badge ${replyRoleClass}">${replyRoleDisplay}</span>
                                </div>
                                <div class="message-text">${formattedReplyMessage}</div>
                                <div class="message-time">${formatDate(reply.created_at)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    messagesHtml += `
                        <div class="message user">
                            <div class="message-bubble">
                                <div class="message-header">
                                    <span class="author-name">${escapeHtml(reply.user_name)}</span>
                                    <span class="role-badge ${replyRoleClass}">${replyRoleDisplay}</span>
                                </div>
                                <div class="message-text">${formattedReplyMessage}</div>
                                <div class="message-time">${formatDate(reply.created_at)}</div>
                            </div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('appRoot').innerHTML = `
                <div class="ticket-detail-layout">
                    <div class="ticket-info-card">
                        <div class="info-card-title">ДЕТАЛИ ОБРАЩЕНИЯ</div>
                        <div class="ticket-detail-number">#${ticket.ticket_number}</div>
                        <div class="ticket-detail-subject">${escapeHtml(ticket.subject)}</div>
                        <div class="info-row">
                            <span class="info-label">Статус</span>
                            <span class="info-value">
                                <span class="ticket-status ${statusClass}">${statusText}</span>
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Приоритет</span>
                            <span class="info-value">
                                <span class="priority-dot ${priorityClass}"></span>
                                ${getPriorityText(ticket.priority)}
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Категория</span>
                            <span class="info-value">${escapeHtml(ticket.department)}</span>
                        </div>
                        ${ticket.subcategory ? `<div class="info-row"><span class="info-label">Подкатегория</span><span class="info-value">${escapeHtml(ticket.subcategory)}</span></div>` : ''}
                        <div class="info-row">
                            <span class="info-label">Создано</span>
                            <span class="info-value">${formatDate(ticket.created_at)}</span>
                        </div>
                        <div class="ticket-message-preview">
                            <div class="ticket-message-preview-label">Первое сообщение</div>
                            <div class="ticket-message-preview-text">${escapeHtml(ticket.message.substring(0, 150))}${ticket.message.length > 150 ? '...' : ''}</div>
                        </div>
                        <div class="action-buttons">
                            <button class="btn-back-card" onclick="navigateTo('/my/tickets')">← Назад</button>
                            <button class="btn-delete-card" id="deleteTicketBtn">🗑 Удалить обращение</button>
                        </div>
                    </div>
                    
                    <div class="chat-container">
                        <div class="chat-header-simple">
                            <h3>Диалог с поддержкой</h3>
                            <p>Ваш диалог по обращению #${ticket.ticket_number}</p>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            ${messagesHtml}
                        </div>
                        <div class="reply-form">
                            <textarea id="replyMessage" placeholder="Введите ваше сообщение..."></textarea>
                            <div class="reply-actions">
                                <button class="btn-send" id="sendReplyBtn">Отправить сообщение</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            const deleteBtn = document.getElementById('deleteTicketBtn');
            if (deleteBtn) {
                deleteBtn.onclick = () => {
                    showConfirm('Удаление обращения', 'Вы уверены, что хотите удалить это обращение? Оно будет удалено безвозвратно.', async () => {
                        try {
                            await apiCall(`/api/tickets/${ticket.id}/delete`, { method: 'DELETE' });
                            showToast('Обращение удалено', 'success');
                            navigateTo('/my/tickets');
                        } catch(e) {
                            showAlert('Ошибка', e.message, 'error');
                        }
                    });
                };
            }
            
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
            
            document.getElementById('sendReplyBtn')?.addEventListener('click', async () => {
                const message = document.getElementById('replyMessage').value.trim();
                if (!message) {
                    showAlert('Ошибка', 'Введите сообщение', 'error');
                    return;
                }
                try {
                    await apiCall(`/api/tickets/${ticket.id}/reply`, { method: 'POST', body: JSON.stringify({ message }) });
                    showToast('Ответ отправлен', 'success');
                    renderTicketDetailPage(ticket.id);
                } catch(e) { 
                    showAlert('Ошибка', e.message, 'error');
                }
            });
        } catch(e) {
            showAlert('Ошибка', 'Ошибка загрузки обращения', 'error');
            navigateTo('/my/tickets');
        }
    }

    async function loadTickets() {
        try {
            allTickets = await apiCall('/api/tickets');
        } catch(e) { allTickets = []; }
    }

    function updateSubcategories(category) {
        const subSelect = document.getElementById('ticketSubcategory');
        if (category && ticketCategories[category]) {
            subSelect.innerHTML = '<option value="">Выберите подкатегорию</option>' +
                ticketCategories[category].subcategories.map(sub => `<option value="${sub}">${sub}</option>`).join('');
            subSelect.disabled = false;
        } else {
            subSelect.innerHTML = '<option value="">Выберите подкатегорию</option>';
            subSelect.disabled = true;
        }
    }

    function getPriorityText(priority) {
        const map = { low: 'Низкий', medium: 'Средний', high: 'Высокий', urgent: 'Критический' };
        return map[priority] || 'Средний';
    }

    function getPriorityDotClass(priority) {
        const map = { low: 'low', medium: 'medium', high: 'high', urgent: 'urgent' };
        return map[priority] || 'medium';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.toggleFaq = function(element) {
        const answer = element.nextElementSibling;
        answer.classList.toggle('show');
        const arrow = element.querySelector('span');
        if (arrow) arrow.innerHTML = answer.classList.contains('show') ? '▲' : '▼';
    };

    window.navigateTo = navigateTo;
    window.updateSubcategories = updateSubcategories;
    window.showAlert = showAlert;

    checkAuth();
</script>
</body>
</html>
