<!-- settings.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Настройки — NULLMARKET</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f3f5fc 0%, #e8eaf6 100%);
            color: #121826;
            line-height: 1.4;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .blur-object {
            position: fixed;
            z-index: 0;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            pointer-events: none;
        }

        .blur-1 { width: 500px; height:500px; background: radial-gradient(circle, #a78bfa, #3b82f6); top: -150px; left: -150px; }
        .blur-2 { width: 600px; height:600px; background: radial-gradient(circle, #f97316, #facc15); bottom: -250px; right: -200px; opacity: 0.4; }

        .container { max-width: 1600px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 2; }

        .header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.6);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(125deg, #0F2027, #203A43, #2C5364);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .nav-links { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
        .nav-link { color: #475569; text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover { color: #4f46e5; }

        .user-menu-container { display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; }
        .user-name { font-weight: 600; color: #1e293b; }
        .user-dropdown { position: absolute; top: 100%; right: 0; margin-top: 8px; background: white; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); min-width: 220px; display: none; overflow: hidden; z-index: 50; }
        .dropdown-header { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
        .dropdown-name { font-weight: 700; font-size: 14px; }
        .dropdown-email { font-size: 11px; color: #64748b; margin-top: 2px; }
        .dropdown-balance { font-size: 13px; margin-top: 6px; color: #f59e0b; font-weight: 600; }
        .dropdown-item { padding: 12px 16px; cursor: pointer; transition: background 0.15s; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .dropdown-item:hover { background: #f1f5f9; }
        .dropdown-item.logout { border-top: 1px solid #e2e8f0; color: #ef4444; }
        .dropdown-icon { width: 18px; height: 18px; }

        .settings-layout {
            display: flex;
            gap: 28px;
            margin: 32px 0;
            min-height: calc(100vh - 160px);
        }

        .settings-sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 100px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .sidebar-title { 
            font-size: 18px; 
            font-weight: 700; 
            margin-bottom: 20px; 
            color: #1e293b; 
            padding-bottom: 12px; 
            border-bottom: 1px solid rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .settings-menu-item { 
            padding: 12px 16px; 
            border-radius: 14px; 
            cursor: pointer; 
            transition: all 0.2s; 
            font-size: 14px; 
            font-weight: 500; 
            color: #475569;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-menu-item:hover { background: rgba(79, 70, 229, 0.08); color: #4f46e5; }
        .settings-menu-item.active { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
        .menu-icon { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
        .menu-icon svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.8; fill: none; }

        .settings-main { flex: 1; min-width: 0; }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title .badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-active { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-inactive { background: #f1f5f9; color: #64748b; }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #1e293b; }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            background: white;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .form-textarea { resize: vertical; min-height: 80px; }

        .btn-action {
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; transform: scale(1.02); }

        .btn-secondary { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #e2e8f0; }

        .btn-success { background: #dcfce7; color: #166534; }
        .btn-success:hover { background: #bbf7d0; }

        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }

        .btn-warning { background: #fed7aa; color: #9b3412; }
        .btn-warning:hover { background: #fdba74; }

        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

        .toggle {
            width: 44px;
            height: 24px;
            background: #cbd5e1;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            flex-shrink: 0;
        }

        .toggle.active { background: #4f46e5; }

        .toggle .dot {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: all 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .toggle.active .dot { left: 23px; }

        .integration-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .integration-row:last-child { border-bottom: none; }

        .integration-row .info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .integration-row .info .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .integration-row .info .name { font-weight: 600; font-size: 14px; color: #1e293b; }
        .integration-row .info .sub { font-size: 12px; color: #94a3b8; }

        .api-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .api-row .key {
            font-family: monospace;
            font-size: 13px;
            color: #4f46e5;
            word-break: break-all;
        }

        .verification-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            margin: 16px 0;
        }

        .v-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .v-card:hover { border-color: #4f46e5; transform: translateY(-3px); box-shadow: 0 4px 16px rgba(79,70,229,0.08); }
        .v-card.selected { border-color: #4f46e5; background: #eef2ff; }

        .v-card .icon { font-size: 28px; color: #4f46e5; margin-bottom: 6px; }
        .v-card .title { font-weight: 600; font-size: 14px; color: #1e293b; }
        .v-card .desc { font-size: 12px; color: #64748b; margin-top: 2px; }

        .v-card .status-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-badge-pending { background: #fef3c7; color: #92400e; }
        .status-badge-approved { background: #dcfce7; color: #166534; }
        .status-badge-rejected { background: #fee2e2; color: #991b1b; }
        .status-badge-none { background: #f1f5f9; color: #64748b; }

        .verif-status-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 20px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .verif-status-box .label { font-weight: 600; font-size: 14px; color: #1e293b; }
        .verif-status-box .value { font-weight: 600; font-size: 14px; }

        .role-badge {
            display: inline-block;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            cursor: default;
            position: relative;
            border-radius: 20px;
        }

        .role-user {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #495057;
            border: 1px solid #dee2e6;
        }

        .role-beta_tester {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .role-support_trainee {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }

        .role-tech_support {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #1a3a2a;
        }

        .role-pro_support {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #5a2d3a;
        }

        .role-recruiter {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: #3d2a5a;
        }

        .role-smm_manager {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }

        .role-pr_manager {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }

        .role-senior_pr_manager {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #5a3a1a;
        }

        .role-content_label_moderator {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #2d5a5a;
        }

        .role-content_moderator {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            color: #4a2d5a;
        }

        .role-senior_content_label_moderator {
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            color: #1a2a5a;
        }

        .role-senior_content_moderator {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            color: #3a2a5a;
        }

        .role-head_beta_testers {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }

        .role-head_cooperation {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }

        .role-head_marketing {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #3a2a1a;
        }

        .role-head_support {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #2a4a4a;
        }

        .role-head_moderation {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            color: #3a2a4a;
        }

        .role-tech_admin {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        .role-developer {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }
        .role-tech_lead {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }
        .role-ciso {
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            color: #fff;
        }

        .role-ceo {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            color: #3a2a0a;
        }

		.role-board_of_directors {
			background: linear-gradient(135deg, #450a0a 0%, #b91c1c 60%, #dc2626 100%);
			color: #fecaca;
		}

        .loading { text-align: center; padding: 60px; color: #64748b; }
        .access-denied { text-align: center; padding: 60px; color: #ef4444; background: rgba(255,255,255,0.9); border-radius: 28px; font-size: 18px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 32px; max-width: 750px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 32px; position: relative; }
        .modal-header { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 12px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .btn-save { background: #4f46e5; color: white; border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #e2e8f0; color: #475569; border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }

        @media (max-width: 1000px) {
            .settings-layout { flex-direction: column; }
            .settings-sidebar { width: 100%; position: static; }
            .user-name { display: none; }
            .nav-links { gap: 12px; }
        }

        @media (max-width: 600px) {
            .container { padding: 0 16px; }
            .header-inner { padding: 12px 16px; }
            .settings-sidebar { padding: 12px; }
            .card { padding: 16px; }
            .verification-grid { grid-template-columns: 1fr 1fr; }
            .api-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="blur-object blur-1"></div>
<div class="blur-object blur-2"></div>

<header class="header">
    <div class="header-inner">
        <div style="display: flex; align-items: center; gap: 32px; flex-wrap: wrap;">
            <span class="logo" onclick="window.location.href='/'">NULLMARKET</span>
            <div class="nav-links">
                <a href="/" class="nav-link">Главная</a>
                <a href="/marketplace" class="nav-link">Маркетплейс</a>
                <a href="/support" class="nav-link">Поддержка</a>
                <a href="/settings" class="nav-link">Настройки</a>
            </div>
        </div>
        <div id="authButtonContainer"><div class="loading">Загрузка...</div></div>
    </div>
</header>

<main class="container">
    <div class="settings-layout">
        <div class="settings-sidebar">
            <div class="sidebar-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                Настройки
            </div>
            <div class="settings-menu" id="settingsMenu">
                <div class="settings-menu-item active" data-section="profile">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                    <span>Профиль</span>
                </div>
                <div class="settings-menu-item" data-section="verification">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span>
                    <span>Верификация</span>
                </div>
                <div class="settings-menu-item" data-section="security">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span>
                    <span>Безопасность</span>
                </div>
                <div class="settings-menu-item" data-section="integrations">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
                    <span>Интеграции</span>
                </div>
                <div class="settings-menu-item" data-section="api">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span>
                    <span>API ключи</span>
                </div>
                <div class="settings-menu-item" data-section="notifications">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
                    <span>Уведомления</span>
                </div>
                <div class="settings-menu-item" data-section="wallet">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg></span>
                    <span>NULL Кошелёк</span>
                </div>
            </div>
        </div>

        <div class="settings-main" id="settingsContent">
            <div id="contentContainer">Загрузка...</div>
        </div>
    </div>
</main>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modalTitle"></div>
        <div id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            <button class="btn-save" id="modalSaveBtn">Сохранить</button>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let currentSection = 'profile';

    // ============ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ============
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    function notice(msg, isError = false) {
        let div = document.createElement('div');
        div.innerText = msg;
        div.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:' + (isError ? '#dc2626' : '#181e2c') + ';color:#f0f3fa;padding:12px 28px;border-radius:56px;font-size:14px;font-weight:500;z-index:9999;backdrop-filter:blur(12px);';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2600);
    }

    async function apiCall(endpoint, options = {}) {
        const response = await fetch(endpoint, {
            headers: { 'Content-Type': 'application/json' },
            ...options
        });
        if (!response.ok) {
            const text = await response.text();
            try {
                const data = JSON.parse(text);
                throw new Error(data.error || 'Ошибка запроса');
            } catch {
                throw new Error('Ошибка сервера: ' + response.status);
            }
        }
        return response.json();
    }

    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    // ============ АВТОРИЗАЦИЯ ============
    async function checkAuth() {
        try {
            const response = await fetch('/api/me');
            if (response.ok) {
                currentUser = await response.json();
                showUserMenu(currentUser);
                loadSection('profile');
            } else {
                window.location.href = '/auth';
            }
        } catch(e) {
            window.location.href = '/auth';
        }
    }

    function showUserMenu(user) {
        const container = document.getElementById('authButtonContainer');
        container.innerHTML = `
            <div class="user-menu-container">
                <img src="${user.avatar}" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?background=4f46e5&color=fff&name=${encodeURIComponent(user.name)}&size=40'">
                <span class="user-name">${user.name}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                <div class="user-dropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-name">${user.name}</div>
                        <div class="dropdown-email">${user.email}</div>
                        <div class="dropdown-balance">Баланс: ${user.balance || 0} ₽</div>
                    </div>
                    <div class="dropdown-item" onclick="window.location.href='/user/${user.user_id}'">
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        Профиль
                    </div>
                    <div class="dropdown-item" onclick="window.location.href='/settings'">
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Настройки
                    </div>
                    <div class="dropdown-item logout" onclick="logout()">
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Выйти
                    </div>
                </div>
            </div>
        `;

        const menuContainer = document.querySelector('.user-menu-container');
        const dropdown = document.querySelector('.user-dropdown');
        menuContainer?.addEventListener('click', (e) => { e.stopPropagation(); dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block'; });
        document.addEventListener('click', () => { if (dropdown) dropdown.style.display = 'none'; });
    }

    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/';
    }

    // ============ МЕНЮ ============
    document.addEventListener('click', function(e) {
        const item = e.target.closest('.settings-menu-item');
        if (item) {
            document.querySelectorAll('.settings-menu-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            const section = item.dataset.section;
            currentSection = section;
            loadSection(section);
        }
    });

    // ============ ЗАГРУЗКА РАЗДЕЛОВ ============
    async function loadSection(section) {
        const container = document.getElementById('contentContainer');
        if (!container) return;

        container.innerHTML = '<div class="loading">Загрузка...</div>';

        try {
            switch(section) {
                case 'profile': await renderProfile(); break;
                case 'verification': await renderVerification(); break;
                case 'security': await renderSecurity(); break;
                case 'integrations': await renderIntegrations(); break;
                case 'api': await renderAPI(); break;
                case 'notifications': await renderNotifications(); break;
                case 'wallet': await renderWallet(); break;
                default: container.innerHTML = '<div class="access-denied">Раздел не найден</div>';
            }
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div class="access-denied">Ошибка загрузки раздела</div>';
        }
    }

    // ============ РАЗДЕЛ: ПРОФИЛЬ ============
    async function renderProfile() {
        if (!currentUser) return;

        const container = document.getElementById('contentContainer');
        container.innerHTML = `
            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Основная информация
                </div>

                <div style="display:flex; align-items:center; gap:20px; margin-bottom:24px; padding:16px 20px; background:#f8fafc; border-radius:14px; border:1px solid #e2e8f0;">
                    <img src="${currentUser.avatar || 'https://ui-avatars.com/api/?background=4f46e5&color=fff&name=' + encodeURIComponent(currentUser.name) + '&size=72&rounded=true'}" style="width:72px; height:72px; border-radius:50%; object-fit:cover; border:2px solid #e2e8f0;">
                    <div>
                        <div style="font-weight:700; font-size:20px; color:#1e293b;">${escapeHtml(currentUser.name)}</div>
                        <div style="color:#64748b; font-size:14px;">${escapeHtml(currentUser.email)}</div>
                        <div style="font-size:13px; color:#f59e0b; font-weight:600; margin-top:4px;">Баланс: ${currentUser.balance || 0} ₽</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Имя</label>
                    <input type="text" class="form-input" id="editName" value="${escapeHtml(currentUser.name || '')}">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="editEmail" value="${escapeHtml(currentUser.email || '')}" disabled style="background:#f1f5f9; cursor:not-allowed;">
                </div>
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" class="form-input" id="editPhone" value="${escapeHtml(currentUser.phone || '')}" placeholder="+7 (999) 123-45-67">
                </div>
                <div class="form-group">
                    <label class="form-label">О себе</label>
                    <textarea class="form-textarea" id="editAbout" rows="3" placeholder="Расскажите о себе">${escapeHtml(currentUser.about || '')}</textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Город</label>
                    <input type="text" class="form-input" id="editLocation" value="${escapeHtml(currentUser.location || '')}" placeholder="Ваш город">
                </div>
                <div class="btn-row">
                    <button class="btn-action btn-primary" onclick="saveProfile()">Сохранить изменения</button>
                </div>
            </div>
        `;
    }

    async function saveProfile() {
        const name = document.getElementById('editName').value.trim();
        const phone = document.getElementById('editPhone').value.trim();
        const about = document.getElementById('editAbout').value.trim();
        const location = document.getElementById('editLocation').value.trim();

        if (!name) { notice('Имя обязательно', true); return; }

        try {
            await apiCall('/api/profile', {
                method: 'PUT',
                body: JSON.stringify({ name, phone, about, location })
            });
            notice('Профиль сохранён');
            setTimeout(() => window.location.reload(), 800);
        } catch(e) {
            notice(e.message, true);
        }
    }

    // ============ РАЗДЕЛ: ВЕРИФИКАЦИЯ ============
    let selectedVerif = null;

    async function renderVerification() {
        if (!currentUser) return;

        const container = document.getElementById('contentContainer');

        const statusMap = {
            1: { label: 'Подтверждённый профиль', class: 'status-badge-approved' },
            2: { label: 'Бизнес профиль', class: 'status-badge-approved' },
            3: { label: 'Амбассадор', class: 'status-badge-approved' },
            4: { label: 'Медиа / Блогер', class: 'status-badge-approved' }
        };

        const currentStatus = currentUser.verified && currentUser.verified > 0 ? statusMap[currentUser.verified] : null;

        container.innerHTML = `
            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Верификация аккаунта
                </div>

                <div class="verif-status-box">
                    <span class="label">Текущий статус:</span>
                    <span class="value" style="color: ${currentStatus ? '#166534' : '#64748b'};">
                        ${currentStatus ? currentStatus.label : 'Не верифицирован'}
                    </span>
                    ${currentStatus ? `<span class="status-badge ${currentStatus.class}" style="font-size:12px;">Подтверждён</span>` : ''}
                </div>

                <div style="font-weight:600; margin-bottom:12px;">Выберите тип верификации:</div>

                <div class="verification-grid">
                    <div class="v-card" data-type="verified">
                        <div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
                        <div class="title">Подтверждённый</div>
                        <div class="desc">Почта + телефон</div>
                        <span class="status-badge ${currentUser.verified === 1 ? 'status-badge-approved' : 'status-badge-none'}">
                            ${currentUser.verified === 1 ? 'Подтверждён' : 'Не подано'}
                        </span>
                    </div>
                    <div class="v-card" data-type="business">
                        <div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="14" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 12v4"/></svg></div>
                        <div class="title">Бизнес</div>
                        <div class="desc">Юридическое лицо</div>
                        <span class="status-badge ${currentUser.verified === 2 ? 'status-badge-approved' : 'status-badge-none'}">
                            ${currentUser.verified === 2 ? 'Подтверждён' : 'Не подано'}
                        </span>
                    </div>
                    <div class="v-card" data-type="ambassador">
                        <div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
                        <div class="title">Амбассадор</div>
                        <div class="desc">Представитель</div>
                        <span class="status-badge ${currentUser.verified === 3 ? 'status-badge-approved' : 'status-badge-none'}">
                            ${currentUser.verified === 3 ? 'Подтверждён' : 'Не подано'}
                        </span>
                    </div>
                    <div class="v-card" data-type="media">
                        <div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="8" x2="12" y2="8"/><line x1="8" y1="16" x2="14" y2="16"/></svg></div>
                        <div class="title">Медиа / Блогер</div>
                        <div class="desc">Контент-мейкер</div>
                        <span class="status-badge ${currentUser.verified === 4 ? 'status-badge-approved' : 'status-badge-none'}">
                            ${currentUser.verified === 4 ? 'Подтверждён' : 'Не подано'}
                        </span>
                    </div>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
                    <button class="btn-action btn-primary" onclick="submitVerification()">Подать заявку</button>
                    <span style="font-size:13px; color:#94a3b8; display:flex; align-items:center;">Рассмотрение до 7 дней</span>
                </div>
            </div>
        `;

        document.querySelectorAll('.v-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.v-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                selectedVerif = this.dataset.type;
            });
        });
    }

    async function submitVerification() {
        if (!selectedVerif) { notice('Выберите тип верификации', true); return; }
        if (!currentUser) { notice('Авторизуйтесь', true); return; }

        try {
            const res = await fetch('/api/verification/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: selectedVerif })
            });
            const data = await res.json();
            if (res.ok) {
                notice('Заявка отправлена! Ожидайте решения до 7 дней.');
                document.querySelectorAll('.v-card').forEach(c => c.classList.remove('selected'));
                selectedVerif = null;
                setTimeout(() => renderVerification(), 1000);
            } else {
                notice(data.error || 'Ошибка', true);
            }
        } catch(e) {
            notice('Ошибка отправки заявки', true);
        }
    }

    // ============ РАЗДЕЛ: БЕЗОПАСНОСТЬ ============
    async function renderSecurity() {
        const container = document.getElementById('contentContainer');
        container.innerHTML = `
            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Смена пароля
                </div>

                <div class="form-group">
                    <label class="form-label">Текущий пароль</label>
                    <input type="password" class="form-input" id="currentPass" placeholder="Введите текущий пароль">
                </div>
                <div class="form-group">
                    <label class="form-label">Новый пароль</label>
                    <input type="password" class="form-input" id="newPass" placeholder="Минимум 6 символов">
                </div>
                <div class="form-group">
                    <label class="form-label">Подтверждение пароля</label>
                    <input type="password" class="form-input" id="confirmPass" placeholder="Повторите новый пароль">
                </div>
                <div class="btn-row">
                    <button class="btn-action btn-primary" onclick="changePassword()">Сменить пароль</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Двухфакторная аутентификация
                    <span class="badge ${currentUser?.twofa_enabled ? 'badge-active' : 'badge-inactive'}">${currentUser?.twofa_enabled ? 'Включена' : 'Отключена'}</span>
                </div>
                <p style="color:#64748b; margin-bottom:16px;">Дополнительный уровень защиты вашего аккаунта</p>
                <button class="btn-action ${currentUser?.twofa_enabled ? 'btn-secondary' : 'btn-primary'}" onclick="toggle2FA()">
                    ${currentUser?.twofa_enabled ? 'Отключить 2FA' : 'Настроить 2FA'}
                </button>
            </div>

            <div class="card" style="border-color:#fee2e2;">
                <div class="card-title" style="color:#dc2626;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4m0 4h.01M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg>
                    Удаление аккаунта
                </div>
                <p style="color:#64748b; margin-bottom:16px;">Это действие необратимо. Все данные будут удалены.</p>
                <button class="btn-action btn-danger" onclick="deleteAccount()">Удалить аккаунт</button>
            </div>
        `;
    }

    async function changePassword() {
        const current = document.getElementById('currentPass').value;
        const newPass = document.getElementById('newPass').value;
        const confirm = document.getElementById('confirmPass').value;

        if (!current || !newPass || !confirm) { notice('Заполните все поля', true); return; }
        if (newPass.length < 6) { notice('Пароль должен быть не менее 6 символов', true); return; }
        if (newPass !== confirm) { notice('Пароли не совпадают', true); return; }

        try {
            await apiCall('/api/change-password', {
                method: 'POST',
                body: JSON.stringify({ current, new: newPass })
            });
            notice('Пароль успешно изменён');
            document.getElementById('currentPass').value = '';
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';
        } catch(e) {
            notice(e.message, true);
        }
    }

    async function toggle2FA() {
        try {
            const res = await apiCall('/api/2fa/toggle', { method: 'POST' });
            notice(res.enabled ? '2FA включена' : '2FA отключена');
            await renderSecurity();
        } catch(e) {
            notice(e.message, true);
        }
    }

    async function deleteAccount() {
        if (confirm('Вы уверены, что хотите удалить аккаунт? Это действие необратимо!')) {
            if (confirm('Все данные будут потеряны. Продолжить?')) {
                try {
                    await apiCall('/api/delete-account', { method: 'POST' });
                    notice('Запрос на удаление отправлен. Проверьте почту.');
                    setTimeout(() => window.location.href = '/', 2000);
                } catch(e) {
                    notice(e.message, true);
                }
            }
        }
    }

    // ============ РАЗДЕЛ: ИНТЕГРАЦИИ ============
    async function renderIntegrations() {
        const container = document.getElementById('contentContainer');
        const integrations = [
            { id: 'google', name: 'Google', icon: 'fab fa-google', color: '#1a73e8', desc: 'Календарь, Drive, Контакты' },
            { id: 'twitter', name: 'Twitter / X', icon: 'fab fa-twitter', color: '#1da1f2', desc: 'Автопостинг, аналитика' },
            { id: 'vk', name: 'VK', icon: 'fab fa-vk', color: '#4a76a8', desc: 'Авторизация, группы, сообщения' },
            { id: 'discord', name: 'Discord', icon: 'fab fa-discord', color: '#5865F2', desc: 'Уведомления, роли' },
            { id: 'instagram', name: 'Instagram', icon: 'fab fa-instagram', color: '#e1306c', desc: 'Публикации, статистика' }
        ];

        const savedIntegrations = JSON.parse(localStorage.getItem('nullmarket_integrations') || '{}');

        container.innerHTML = `
            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    Подключенные сервисы
                </div>

                ${integrations.map(i => `
                    <div class="integration-row">
                        <div class="info">
                            <div class="icon-box" style="color:${i.color}; background:${i.color}10;"><i class="${i.icon}"></i></div>
                            <div>
                                <div class="name">${i.name}</div>
                                <div class="sub">${i.desc}</div>
                            </div>
                        </div>
                        <div class="toggle ${savedIntegrations[i.id] ? 'active' : ''}" data-integration="${i.id}" onclick="toggleIntegration('${i.id}')">
                            <div class="dot"></div>
                        </div>
                    </div>
                `).join('')}

                <div class="btn-row" style="margin-top:16px;">
                    <button class="btn-action btn-primary" onclick="saveIntegrations()">Сохранить настройки</button>
                </div>
            </div>
        `;
    }

    function toggleIntegration(id) {
        const toggle = document.querySelector(`.toggle[data-integration="${id}"]`);
        if (toggle) toggle.classList.toggle('active');
    }

    function saveIntegrations() {
        const integrations = {};
        document.querySelectorAll('.toggle[data-integration]').forEach(t => {
            integrations[t.dataset.integration] = t.classList.contains('active');
        });
        localStorage.setItem('nullmarket_integrations', JSON.stringify(integrations));
        notice('Настройки интеграций сохранены');
    }

    // ============ РАЗДЕЛ: API КЛЮЧИ ============
    async function renderAPI() {
        const container = document.getElementById('contentContainer');
        const publicKey = localStorage.getItem('nullmarket_public_key') || 'Не сгенерирован';
        const secretKey = localStorage.getItem('nullmarket_secret_key') || 'Не сгенерирован';

        container.innerHTML = `
            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    API ключи
                </div>

                <div class="api-row">
                    <span style="font-weight:600; font-size:14px;">Публичный ключ</span>
                    <span class="key" id="publicKeyDisplay">${publicKey}</span>
                    <button class="btn-action btn-secondary" style="padding:4px 16px; font-size:12px;" onclick="generatePublicKey()">Сгенерировать</button>
                </div>

                <div class="api-row">
                    <span style="font-weight:600; font-size:14px;">Секретный ключ</span>
                    <span class="key" id="secretKeyDisplay">${secretKey}</span>
                    <button class="btn-action btn-secondary" style="padding:4px 16px; font-size:12px;" onclick="generateSecretKey()">Сгенерировать</button>
                </div>

                <div style="background:#fef3c7; border-radius:12px; padding:14px 18px; border:1px solid #f59e0b; margin-top:12px;">
                    <span style="font-weight:600; font-size:13px; color:#92400e;">⚠️ Никогда не передавайте секретный ключ третьим лицам</span>
                </div>

                <div class="btn-row" style="margin-top:16px;">
                    <button class="btn-action btn-secondary" onclick="regenerateAllKeys()">Перегенерировать все ключи</button>
                </div>
            </div>
        `;
    }

    function generatePublicKey() {
        const key = 'pk_' + Math.random().toString(36).substring(2, 12) + Math.random().toString(36).substring(2, 12);
        localStorage.setItem('nullmarket_public_key', key);
        document.getElementById('publicKeyDisplay').textContent = key;
        notice('Публичный ключ сгенерирован');
    }

    function generateSecretKey() {
        const key = 'sk_' + Math.random().toString(36).substring(2, 12) + Math.random().toString(36).substring(2, 12);
        localStorage.setItem('nullmarket_secret_key', key);
        document.getElementById('secretKeyDisplay').textContent = key;
        notice('Секретный ключ сгенерирован');
    }

    function regenerateAllKeys() {
        if (confirm('Перегенерировать все ключи? Старые ключи станут недействительными.')) {
            generatePublicKey();
            generateSecretKey();
        }
    }

    // ============ РАЗДЕЛ: УВЕДОМЛЕНИЯ ============
    async function renderNotifications() {
        const container = document.getElementById('contentContainer');
        const saved = JSON.parse(localStorage.getItem('nullmarket_notifications') || '{"email":true,"push":true,"deals":true,"newsletter":false}');

        const items = [
            { id: 'email', name: 'Уведомления на email', desc: 'Получать уведомления о важных событиях' },
            { id: 'push', name: 'Push-уведомления', desc: 'Уведомления в браузере' },
            { id: 'deals', name: 'Уведомления о сделках', desc: 'Новые заказы, статусы оплат, отзывы' },
            { id: 'newsletter', name: 'Рассылка новостей', desc: 'Анонсы, обновления и акции' }
        ];

        container.innerHTML = `
            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    Настройки уведомлений
                </div>

                ${items.map(i => `
                    <div class="integration-row">
                        <div class="info">
                            <div>
                                <div class="name">${i.name}</div>
                                <div class="sub">${i.desc}</div>
                            </div>
                        </div>
                        <div class="toggle ${saved[i.id] ? 'active' : ''}" data-notification="${i.id}" onclick="toggleNotification('${i.id}')">
                            <div class="dot"></div>
                        </div>
                    </div>
                `).join('')}

                <div class="btn-row" style="margin-top:16px;">
                    <button class="btn-action btn-primary" onclick="saveNotifications()">Сохранить настройки</button>
                </div>
            </div>
        `;
    }

    function toggleNotification(id) {
        const toggle = document.querySelector(`.toggle[data-notification="${id}"]`);
        if (toggle) toggle.classList.toggle('active');
    }

    function saveNotifications() {
        const settings = {};
        document.querySelectorAll('.toggle[data-notification]').forEach(t => {
            settings[t.dataset.notification] = t.classList.contains('active');
        });
        localStorage.setItem('nullmarket_notifications', JSON.stringify(settings));
        notice('Настройки уведомлений сохранены');
    }

    // ============ РАЗДЕЛ: NULL КОШЕЛЁК ============
    async function renderWallet() {
        if (!currentUser) return;

        const container = document.getElementById('contentContainer');

        container.innerHTML = `
            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                    NULL Кошелёк
                </div>

                <div style="text-align:center; padding:20px 0;">
                    <div style="font-size:48px; font-weight:800; color:#4f46e5;">${currentUser.balance || 0} ₽</div>
                    <div style="color:#64748b; font-size:14px;">Текущий баланс</div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <button class="btn-action btn-primary" onclick="deposit()" style="justify-content:center;">Пополнить</button>
                    <button class="btn-action btn-secondary" onclick="withdraw()" style="justify-content:center;">Вывести</button>
                </div>

                <div style="margin-top:20px; padding:16px; background:#f8fafc; border-radius:12px; border:1px solid #e2e8f0;">
                    <div style="font-weight:600; margin-bottom:8px;">Способы вывода</div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <span style="background:white; padding:4px 14px; border-radius:20px; font-size:13px; border:1px solid #e2e8f0;">Банковская карта</span>
                        <span style="background:white; padding:4px 14px; border-radius:20px; font-size:13px; border:1px solid #e2e8f0;">СБП</span>
                        <span style="background:white; padding:4px 14px; border-radius:20px; font-size:13px; border:1px solid #e2e8f0;">USDT (TRC20)</span>
                        <span style="background:white; padding:4px 14px; border-radius:20px; font-size:13px; border:1px solid #e2e8f0;">Bitcoin</span>
                    </div>
                </div>

                <div class="form-group" style="margin-top:20px;">
                    <label class="form-label">Реквизиты для вывода</label>
                    <input type="text" class="form-input" id="paymentDetails" placeholder="Номер карты или кошелёк" value="${localStorage.getItem('nullmarket_payment_details') || ''}">
                </div>
                <div class="btn-row">
                    <button class="btn-action btn-primary" onclick="savePaymentDetails()">Сохранить реквизиты</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16h16M8 12h8M8 8h4M8 16h6"/></svg>
                    История операций
                </div>
                <div style="text-align:center; padding:40px; color:#94a3b8;">
                    История операций будет доступна в ближайшее время
                </div>
            </div>
        `;
    }

    function deposit() {
        notice('Переход на страницу пополнения кошелька');
    }

    function withdraw() {
        notice('Переход на страницу вывода средств');
    }

    function savePaymentDetails() {
        const details = document.getElementById('paymentDetails').value.trim();
        if (!details) { notice('Введите реквизиты', true); return; }
        localStorage.setItem('nullmarket_payment_details', details);
        notice('Реквизиты сохранены');
    }

    // ============ ЗАПУСК ============
    document.addEventListener('DOMContentLoaded', checkAuth);

    // Глобальные функции для вызова из HTML
    window.saveProfile = saveProfile;
    window.submitVerification = submitVerification;
    window.changePassword = changePassword;
    window.toggle2FA = toggle2FA;
    window.deleteAccount = deleteAccount;
    window.toggleIntegration = toggleIntegration;
    window.saveIntegrations = saveIntegrations;
    window.generatePublicKey = generatePublicKey;
    window.generateSecretKey = generateSecretKey;
    window.regenerateAllKeys = regenerateAllKeys;
    window.toggleNotification = toggleNotification;
    window.saveNotifications = saveNotifications;
    window.deposit = deposit;
    window.withdraw = withdraw;
    window.savePaymentDetails = savePaymentDetails;
    window.closeModal = closeModal;
</script>
</body>
</html>
